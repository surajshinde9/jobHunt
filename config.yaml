
# jobhunt configuration — customized for Suraj Shinde
#
# Target: 2027 BE ENTC graduate
# Focus: Software Engineering, Backend, Full Stack, Node.js, AI Applications

filters:
  include_titles:
    # Software engineering
    - '\b(software|application|product)\s+engineer\b'
    - '\bsoftware development engineer\b'
    - '\bsoftware engineer\b'
    - '\bassociate software engineer\b'
    - '\bgraduate software engineer\b'
    - '\bjunior software engineer\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,2}|[12])\b'
    - '\bmember of technical staff\b'

    # Backend / Node.js
    - '\b(backend|back-end|server-side)\b.*\b(developer|engineer)\b'
    - '\b(developer|engineer)\b.*\b(backend|back-end)\b'
    - '\bnode(\.js|js)?\s+(developer|engineer)\b'
    - '\bapi\s+(developer|engineer)\b'
    - '\bplatform engineer\b'

    # Full stack / Web development
    - '\bfull[\s-]?stack\b.*\b(developer|engineer)\b'
    - '\b(developer|engineer)\b.*\bfull[\s-]?stack\b'
    - '\bweb developer\b'
    - '\bweb application engineer\b'
    - '\bfrontend\b.*\b(developer|engineer)\b'
    - '\bfront-end\b.*\b(developer|engineer)\b'

    # C++ / Programming
    - '\bc\+\+\b.*\b(developer|engineer)\b'
    - '\b(developer|engineer)\b.*\bc\+\+\b'

    # AI application development
    - '\b(ai|artificial intelligence)\b.*\b(application|software|backend)\b.*\b(engineer|developer)\b'
    - '\b(generative ai|genai)\b.*\b(engineer|developer)\b'
    - '\bllm\b.*\b(application|software)\b.*\b(engineer|developer)\b'
    - '\bai application developer\b'

    # Entry-level / Graduate roles
    - '\bgraduate engineer trainee\b'
    - '\bengineering graduate trainee\b'
    - '\bassociate developer\b'
    - '\bjunior developer\b'
    - '\bsoftware trainee\b'

  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(lead|director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(sales|account executive|marketing|recruit|customer support|customer success)\b'
    - '\b(data scientist|machine learning scientist|research scientist)\b'
    - '\b(embedded|firmware|hardware|electrical|mechanical)\b'
    - '\bqa automation manager\b'

  # Preferred Indian technology hubs
  locations:
    - pune
    - bangalore
    - bengaluru
    - hyderabad
    - mumbai
    - chennai
    - india

  allow_remote: true

  max_age_days: 30

# --- LLM stages -------------------------------------------------------------

screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000

score_threshold: 7.0
max_per_digest: 5

# --- paths ------------------------------------------------------------------

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
